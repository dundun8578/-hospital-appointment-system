server:
  port: 8085

spring:
  application:
    name: hospital-order

  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hospital_appointment?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:hospital_local}
    password: ${RABBITMQ_PASSWORD:hospital_local_dev_2026}
    virtual-host: ${RABBITMQ_VHOST:hospital}
    listener:
      simple:
        acknowledge-mode: auto
        # 重试耗尽后消息不再重入队，经死信交换机进入 appointment.dlq
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  mapper-locations: classpath*:/mapper/**/*.xml, classpath*:/mapper/*.xml
  type-aliases-package: com.hospital.order.entity

logging:
  level:
    root: INFO
    com.hospital: DEBUG
    com.baomidou.mybatisplus: DEBUG
