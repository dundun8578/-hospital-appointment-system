server:
  port: 8084

spring:
  application:
    name: hospital-appointment

  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hospital_appointment?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:hospital_local}
    password: ${RABBITMQ_PASSWORD:hospital_local_dev_2026}
    virtual-host: ${RABBITMQ_VHOST:hospital}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  mapper-locations: classpath*:/mapper/**/*.xml, classpath*:/mapper/*.xml
  type-aliases-package: com.hospital.appointment.entity, com.hospital.doctor.entity

jwt:
  secret: hospital-appointment-system-secret-key-2024
  expiration: 604800000

# 预约配置
appointment:
  lock-wait-time: 5
  lock-lease-time: 30
  lua-script-path: lua/deduct_stock.lua
  outbox:
    publish-interval-ms: 2000

logging:
  level:
    root: INFO
    com.hospital: DEBUG
    com.baomidou.mybatisplus: DEBUG
